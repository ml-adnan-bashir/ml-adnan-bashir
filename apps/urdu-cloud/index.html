*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#000;color:#e8eee8;font-family:var(--urdu)}
body{min-height:100svh;display:grid;grid-template-rows:minmax(0,1fr) auto}
#stage{position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:calc(100svh - 74px);min-height:300px;padding:12px 2vw 0;overflow:hidden}
#cloud{width:100%;height:100%;max-width:1600px;overflow:visible;touch-action:pan-y;user-select:none;-webkit-user-select:none}
#wordLayer text,#highlight text{font-family:var(--cloud-font,UrduCloud);font-weight:400}
.word{outline:none;cursor:pointer}.word.is-active{opacity:.13}.word:focus-visible{outline:none}
#highlight{pointer-events:none}#highlight *{pointer-events:none}#highlight text{fill:#fff;stroke:#000;stroke-linejoin:round;paint-order:stroke fill;filter:drop-shadow(0 0 7px #000)}
.controls{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 24px;min-height:74px;padding:7px 16px 12px;font-size:18px}
.controls label{color:#aeb5ae}select{font:18px var(--urdu);color:#edf3ed;background:#101410;border:1px solid #3a433d;border-radius:7px;min-height:40px;max-width:80vw;width:188px;padding:1px 12px;cursor:pointer}
select:focus-visible{outline:2px solid #a6d7ff;outline-offset:3px}
#loading{position:absolute;color:#b2bdb4;font-size:22px;pointer-events:none}#loading[hidden]{display:none}
.control-group{display:flex;align-items:center;gap:9px}.swatches{display:flex;gap:4px;direction:ltr}.swatches i{display:block;width:13px;height:13px;border-radius:50%}#font{width:126px}@media(max-width:660px){#stage{padding:12px 10px 0;height:calc(100svh - 110px)}.controls{min-height:110px;gap:5px 18px;padding:5px 12px 12px}select{font-size:17px}.swatches{gap:3px}.swatches i{width:10px;height:10px}}

const cloud=document.getElementById('cloud'),stage=document.getElementById('stage'),wordLayer=document.getElementById('wordLayer'),highlight=document.getElementById('highlight'),picker=document.getElementById('palette');

function makeMask(text,size,cell){
 const c=document.createElement('canvas'),ctx=c.getContext('2d',{willReadFrequently:true});
 ctx.font=size+'px '+fontFamily;
 const width=Math.ceil(ctx.measureText(text).width),pad=Math.ceil(size*.4)+8;
 c.width=width+pad*2;c.height=Math.ceil(size*2.9)+16;
 ctx.font=size+'px '+fontFamily;ctx.direction='rtl';ctx.textAlign='center';ctx.fillStyle='white';
 const tx=c.width/2,ty=Math.ceil(size*1.75);ctx.fillText(text,tx,ty);
 const pixels=ctx.getImageData(0,0,c.width,c.height).data;
 let left=c.width,right=0,top=c.height,bottom=0;
 for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++)if(pixels[(y*c.width+x)*4+3]>40){left=Math.min(left,x);right=Math.max(right,x);top=Math.min(top,y);bottom=Math.max(bottom,y)}
 if(right<left)return null;
 left=Math.max(0,left-cell);top=Math.max(0,top-cell);right=Math.min(c.width-1,right+cell);bottom=Math.min(c.height-1,bottom+cell);
 const w=Math.ceil((right-left+1)/cell),h=Math.ceil((bottom-top+1)/cell),cells=new Uint8Array(w*h);
 for(let y=top;y<=bottom;y++)for(let x=left;x<=right;x++)if(pixels[(y*c.width+x)*4+3]>40){let gx=Math.floor((x-left)/cell),gy=Math.floor((y-top)/cell);for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){let a=gx+dx,b=gy+dy;if(a>=0&&a<w&&b>=0&&b<h)cells[b*w+a]=1}}
 const points=[];for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(cells[y*w+x])points.push([x,y]);
 return{w,h,points,cells,tx:tx-left,ty:ty-top};
}

function addWord(item,mask,x,y,size,color,cell,first){

 text.setAttribute('font-size',size);text.setAttribute('text-anchor','middle');text.setAttribute('direction','rtl');
 text.setAttribute('fill',palettes[picker.value][color]);text.textContent=PHRASES[item].phrase;
 g.append(text);wordLayer.append(g);
 const entry={id:item,g,text,mask,x:x*cell,y:y*cell,w:mask.w*cell,h:mask.h*cell,cx,cy,size,color,cell};
 placements.push(entry);
 g.addEventListener('focus',()=>setActive(entry));g.addEventListener('blur',()=>{if(active===entry)setActive(null)});
 g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();setActive(active===entry?null:entry)}});
}
function setActive(entry){
 if(active===entry)return;
 if(active)active.g.classList.remove('is-active');
 active=entry;highlight.replaceChildren();cloud.style.cursor=entry?'pointer':'default';
 if(!entry){highlight.removeAttribute('data-phrase');return}
 entry.g.classList.add('is-active');
 const scaleOnScreen=Math.abs(cloud.getScreenCTM()?.a||1);
 const scale=Math.max(1.2,Math.min(3.2,31/(entry.size*scaleOnScreen)));
 const halfW=entry.w*scale/2,halfH=entry.h*scale/2;
 const centerX=Math.max(halfW+8,Math.min(viewWidth-halfW-8,entry.cx));
 const centerY=Math.max(halfH+8,Math.min(viewHeight-halfH-8,entry.cy));
 const ink=entry.text.cloneNode(true);
 ink.setAttribute('fill','#ffffff');ink.setAttribute('stroke-width',Math.max(1.5,4/scale));
 highlight.setAttribute('transform',`translate(${centerX} ${centerY}) scale(${scale})`);
 highlight.setAttribute('data-phrase',PHRASES[entry.id].phrase);highlight.append(ink);
}
function hitTest(event){
 const matrix=cloud.getScreenCTM();if(!matrix)return null;
 const point=cloud.createSVGPoint();point.x=event.clientX;point.y=event.clientY;
 const p=point.matrixTransform(matrix.inverse());
 let best=null,bestRank=Infinity;
 for(const entry of placements){
  const dx=p.x-entry.x,dy=p.y-entry.y;
  if(dx<0||dy<0||dx>entry.w||dy>entry.h)continue;
  const gx=Math.floor(dx/entry.cell),gy=Math.floor(dy/entry.cell);
  const onInk=gx<entry.mask.w&&gy<entry.mask.h&&entry.mask.cells[gy*entry.mask.w+gx];
  const rank=(onInk?0:100000000)+entry.w*entry.h;
  if(rank<bestRank){bestRank=rank;best=entry}
 }
 return best;
}
// Test the original word positions, never the enlarged overlay.
cloud.addEventListener('pointermove',event=>{if(event.pointerType!=='touch')setActive(hitTest(event))});
cloud.addEventListener('pointerleave',event=>{if(event.pointerType!=='touch')setActive(null)});
cloud.addEventListener('pointerdown',event=>{if(event.pointerType==='touch'||event.pointerType==='pen'){const hit=hitTest(event);setActive(hit===active?null:hit)}});
cloud.addEventListener('click',event=>{if(!event.pointerType)setActive(hitTest(event))});
window.addEventListener('blur',()=>setActive(null));
window.addEventListener('keydown',event=>{if(event.key==='Escape')setActive(null)});
function paintSwatches(){const el=document.getElementById('swatches');el.replaceChildren();palettes[picker.value].forEach(color=>{const dot=document.createElement('i');dot.style.background=color;el.append(dot)})}
paintSwatches();
picker.addEventListener('change',()=>{setActive(null);const palette=palettes[picker.value];placements.forEach(entry=>entry.text.setAttribute('fill',palette[entry.color]));paintSwatches()});
picker.addEventListener('pointerenter',()=>setActive(null));
async function layout(){
 const token=++layoutToken;setActive(null);cloud.setAttribute('aria-busy','true');
 document.getElementById('loading').hidden=false;await pause();
 const compact=mobile();viewWidth=compact?700:1200;viewHeight=compact?880:760;
 cloud.setAttribute('viewBox',`0 0 ${viewWidth} ${viewHeight}`);wordLayer.replaceChildren();placements=[];
 const cell=2,cols=Math.ceil(viewWidth/cell),rows=Math.ceil(viewHeight/cell),occupied=new Uint8Array(cols*rows);
 const random=rngFor(layoutSeed),seen=new Set(),cx=cols/2,cy=rows/2,rx=cols*.485,ry=rows*.485;
 const queue=[];
 PHRASES.forEach((p,i)=>queue.push({id:i,size:p.size*(compact?.67:1),color:p.color??i%6}));
 for(let i=0;i<(compact?105:185);i++){const id=Math.floor(random()*PHRASES.length);queue.push({id,size:(compact?17:16)+random()*(compact?6:7),color:Math.floor(random()*6)})}
 function fits(m,x,y){
  if(x<0||y<0||x+m.w>=cols||y+m.h>=rows)return false;
  for(const [px,py]of[[x,y],[x+m.w,y],[x,y+m.h],[x+m.w,y+m.h]])if(((px-cx)/rx)**2+((py-cy)/ry)**2>1)return false;
  for(const [px,py]of m.points)if(occupied[(y+py)*cols+x+px])return false;return true;
 }
 for(let k=0;k<queue.length;k++){
  if(token!==layoutToken)return;
  const q=queue[k];let size=q.size,mask,position;
  for(let retry=0;retry<3&&!position;retry++){
   mask=makeMask(PHRASES[q.id].phrase,size,cell);if(!mask)break;
   if(mask.w>cols*.94){size*=cols*.90/mask.w;mask=makeMask(PHRASES[q.id].phrase,size,cell)}
   let anchorX=cx,anchorY=cy;
   if(k===0)anchorY=cy-rows*.015;
   else if(k===1)anchorY=cy+rows*.245;
   else if(k===2)anchorY=cy-rows*.245;
   else if(k===3)anchorY=cy+rows*.10;
   else if(k<12){const theta=random()*Math.PI*2;anchorX=cx+Math.cos(theta)*rx*.35;anchorY=cy+Math.sin(theta)*ry*.42}
   const attempts=k<PHRASES.length?2800:1000,turn=random()*6.28;
   for(let t=0;t<attempts;t++){
    let px,py;
    if(t<(k>=PHRASES.length?160:1300)){const r=Math.sqrt(t)*2.55,theta=t*.43+turn;px=anchorX+Math.cos(theta)*r;py=anchorY+Math.sin(theta)*r*.81}
    else{px=cx+(random()*2-1)*rx;py=cy+(random()*2-1)*ry}
    let x=Math.round(px-mask.w/2),y=Math.round(py-mask.h/2);
    if(fits(mask,x,y)){position={x,y};break}
   }
   if(!position)size*=.84;
  }
  if(position){const{x,y}=position;for(const[px,py]of mask.points)occupied[(y+py)*cols+x+px]=1;addWord(q.id,mask,x,y,size,q.color,cell,!seen.has(q.id));seen.add(q.id)}
  if(k%14===0)await pause();
 }
 if(token!==layoutToken)return;
 document.getElementById('loading').hidden=true;
 cloud.setAttribute('aria-busy','false');
}

document.getElementById('font').addEventListener('change',async event=>{const family=event.target.value;await document.fonts.load('30px '+family,'ہلاک ہو گیا');fontFamily=family;cloud.style.setProperty('--cloud-font',family);layout()});
let wasCompact=mobile(),resizeTimer;
new ResizeObserver(()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(wasCompact!==mobile()){wasCompact=mobile();layout()}else if(active){const entry=active;setActive(null);setActive(entry)}},150)}).observe(stage);
document.fonts.load('30px UrduCloud','ہلاک ہو گیا').then(()=>layout()).catch(()=>{document.getElementById('loading').textContent='صفحہ دوبارہ کھولیں۔'});
</script>
